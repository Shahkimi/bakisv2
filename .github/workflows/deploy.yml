name: Deploy

on:
  push:
    branches:
      - new_user_role

env:
  DEPLOY_URL: https://bakishsb.kdh.moh.gov.my/deploy.php

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hit deploy.php
        run: |
          curl --fail --show-error --silent --max-time 600 \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "$DEPLOY_URL"
