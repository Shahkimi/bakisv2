name: Deploy

on:
  push:
    branches:
      - new_user_role

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hit deploy.php
        run: |
          curl --fail --show-error --silent --max-time 600 \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.DEPLOY_URL }}"
